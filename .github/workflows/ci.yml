name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    name: Compile (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [mqtt, mqtt.tls, http, gateway, entities]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Controller registration needs esphome #19588, which is only on dev
      # until 2026.10.0 ships.
      - name: Install ESPHome (dev)
        run: pip install "esphome @ git+https://github.com/esphome/esphome@dev"

      - name: Compile test firmware
        run: esphome compile tests/test.${{ matrix.transport }}.yaml
